# Infra: Postgres + Redis + App (+ TURN tùy chọn)
# Local / server bạn:
#   docker compose up -d --build
# Chỉ DB+Redis (máy anh đang dev):
#   docker compose up -d db redis
# TURN:
#   docker compose --profile turn up -d

services:
  db:
    image: postgres:16
    container_name: moora-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: hoshi
      POSTGRES_PASSWORD: hoshipassword
      POSTGRES_DB: hoshi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoshi -d hoshi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: moora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: moora-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://hoshi:hoshipassword@db:5432/hoshi
      REDIS_URL: redis://redis:6379/0
      ALLOW_LOCAL_MEDIA: "True"
    ports:
      - "8000:8000"
    volumes:
      # Giữ ảnh / video / audio khi rebuild
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Coturn — TURN tự host (profile turn)
  turn:
    image: coturn/coturn:4.6
    container_name: moora-turn
    restart: unless-stopped
    profiles: ["turn"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    environment:
      DETECT_EXTERNAL_IP: "yes"
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_REALM: ${TURN_REALM:-moora}
      TURN_USER: ${TURN_USERNAME:-moora}
      TURN_PASS: ${TURN_CREDENTIAL:-mooraturn}
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=${TURN_USERNAME:-moora}:${TURN_CREDENTIAL:-mooraturn}"
      - "--realm=${TURN_REALM:-moora}"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--listening-ip=0.0.0.0"
      - "--relay-ip=0.0.0.0"
      - "--external-ip=${TURN_EXTERNAL_IP}"

volumes:
  postgres_data:
  redis_data:
  media_data:
