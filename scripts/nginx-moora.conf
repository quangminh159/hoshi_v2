# Nginx reverse proxy cho Moora (VPS + HTTPS)
# 1) Đổi moora.vn → domain anh
# 2) Certbot: sudo certbot --nginx -d moora.vn -d www.moora.vn
# 3) App Daphne listen 127.0.0.1:8000

upstream moora_asgi {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name moora.vn www.moora.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name moora.vn www.moora.vn;

    # Certbot sẽ ghi ssl_certificate / ssl_certificate_key

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/moora/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Media local chỉ khi CHƯA dùng R2 — production nên R2
    # location /media/ {
    #     alias /var/www/moora/media/;
    # }

    location / {
        proxy_pass http://moora_asgi;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (chat / signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
