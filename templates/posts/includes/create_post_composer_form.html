<form method="post" action="{% url 'posts:create' %}" enctype="multipart/form-data" id="postForm" data-ajax-submit="true">
    {% csrf_token %}

    <div class="create-post-body">
        <div class="composer-row">
            <img src="{{ request.user.get_avatar_url }}" alt="{{ request.user.username }}" class="composer-avatar">
            <div class="composer-input-wrap position-relative">
                <textarea id="caption"
                          name="caption"
                          class="form-control composer-textarea"
                          rows="3"
                          placeholder="Bạn đang nghĩ gì? Dùng #hashtag hoặc @tag..."></textarea>
                <div id="suggestionBox"></div>
            </div>
        </div>

        <div class="composer-media-tools">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="postMediaPickBtn" title="Chọn ảnh hoặc video">
                <i class="far fa-image me-1"></i>Ảnh
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="postAudioPickBtn" title="Chọn file nhạc">
                <i class="fas fa-music me-1"></i>Nhạc
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="postVoiceRecordBtn" title="Ghi âm">
                <i class="fas fa-microphone me-1"></i>Ghi âm
            </button>
            <input type="file"
                   id="postMediaFileInput"
                   class="d-none"
                   accept="image/*,video/*"
                   multiple>
            <input type="file"
                   id="postAudioFileInput"
                   class="d-none"
                   accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac,.wma">
        </div>

        <div class="upload-zone" id="composerUploadZone">
            <input type="file"
                   id="media"
                   class="filepond"
                   accept="image/*,video/*,audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac"
                   multiple
                   data-allow-reorder="true">
        </div>

        <div id="postVoiceRecordingBar" class="post-voice-recording-bar d-none">
            <span class="post-voice-rec-dot" aria-hidden="true"></span>
            <span class="post-voice-timer" id="postVoiceTimer">0:00</span>
            <span class="post-voice-hint">Đang ghi âm...</span>
            <div class="post-voice-actions ms-auto">
                <button type="button" class="btn btn-sm btn-light" id="postVoiceCancelBtn">Hủy</button>
                <button type="button" class="btn btn-sm btn-primary" id="postVoiceSaveBtn">
                    <i class="fas fa-check me-1"></i>Dùng bản ghi
                </button>
            </div>
        </div>

        <p class="upload-hint">Ảnh, video, nhạc hoặc ghi âm (tùy chọn) · hoặc chỉ đăng chữ · tối đa 1GB/file</p>

        <div class="extra-fields">
            <div class="location-field">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                    <input type="text"
                           id="location"
                           name="location"
                           class="form-control"
                           autocomplete="off"
                           placeholder="Tìm hoặc chọn địa điểm (tùy chọn)">
                    <button type="button"
                            class="btn btn-current-location"
                            id="btnCurrentLocation"
                            title="Dùng vị trí hiện tại">
                        <i class="fas fa-crosshairs"></i>
                    </button>
                </div>
                <div id="locationSuggestionBox"></div>
            </div>
        </div>
    </div>

    <div class="create-post-footer">
        <p class="footer-hint mb-0 d-none d-sm-block">Có thể đăng chữ, ảnh, video hoặc âm thanh</p>
        <button type="submit" class="btn btn-post-submit ms-sm-auto">
            <i class="fas fa-paper-plane"></i>
            <span>Đăng bài</span>
        </button>
    </div>
</form>
