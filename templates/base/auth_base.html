<!DOCTYPE html>
{% load static %}
{% load i18n %}
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function () {
        try {
            var mode = localStorage.getItem('hoshi-theme') || 'system';
            var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var theme = dark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', theme);
            document.documentElement.setAttribute('data-theme-mode', mode);
            document.documentElement.style.colorScheme = theme;
        } catch (e) {}
    })();
    </script>
    <title>{% block title %}Hoshi - Mạng xã hội chia sẻ khoảnh khắc{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="{% static 'css/cross_browser.css' %}?v=2" rel="stylesheet">
    <link href="{% static 'css/style.css' %}?v=unify-auth-2" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}?v=dark-logo-1" rel="stylesheet">
    <link href="{% static 'css/auth-flow.css' %}?v=unify-2" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <button type="button" class="theme-toggle-btn position-fixed top-0 end-0 m-3" style="z-index: 1050;" data-theme-toggle aria-label="{% trans 'Đổi giao diện sáng/tối' %}">
        <i class="fas fa-sun theme-icon-sun" aria-hidden="true"></i>
        <i class="fas fa-moon theme-icon-moon" aria-hidden="true"></i>
    </button>
    {% block content %}{% endblock %}
    
    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="successToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
        
        <div id="errorToast" class="toast align-items-center text-white bg-danger border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="errorToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/theme.js' %}?v=1"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
